services:
  redis:
    image: redis:7-alpine
    container_name: webscraping-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  api:
    build: .
    container_name: webscraping-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - UV_COMPILE_BYTECODE=1
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: webscraping-worker
    env_file:
      - .env
    environment:
      - UV_COMPILE_BYTECODE=1
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "celery", "-A", "app.core.celery:celery_app", "worker", "--loglevel=info"]

volumes:
  redis_data:
