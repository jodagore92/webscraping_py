services:
  redis:
    image: redis:7-alpine
    container_name: webscraping-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  mongodb:
    image: mongo:8.0
    container_name: webscraping-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    container_name: webscraping-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - UV_COMPILE_BYTECODE=1
      - REDIS_URL=${REDIS_URL}
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started

  worker:
    build: .
    container_name: webscraping-worker
    env_file:
      - .env
    environment:
      - UV_COMPILE_BYTECODE=1
      - REDIS_URL=${REDIS_URL}
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
    command: ["python", "-m", "celery", "-A", "app.core.celery:celery_app", "worker", "--loglevel=info"]

volumes:
  redis_data:
  mongo_data:
